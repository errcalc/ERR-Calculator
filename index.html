<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
  <title>ERR Calculator</title>
  <link rel="stylesheet" href="css/styles.css?v=20260917g" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>
  <header class="app-header">
    <nav class="header-actions header-left">
      <button id="info-btn" class="ghost-btn header-info" title="How this page works — user guide" aria-label="User guide">i</button>
    </nav>
    <div class="brand" id="brand-home">
      <span class="brand-title">Effective Rate of Return Calculator</span>
      <span class="brand-sub">Developed by SP&amp;T, IDLC</span>
    </div>
    <nav class="header-actions">
      <button id="theme-toggle" class="ghost-btn" title="Toggle dark/light">
        <span id="theme-icon">&#9788;</span>
      </button>
    </nav>
  </header>

  <main id="app-root"></main>

  <div id="modal-root" class="modal-root hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <section class="compare-bar hidden" id="compare-bar">
    <button id="compare-btn" class="ghost-btn" title="Compare saved summaries">
      <span class="badge" id="saved-count">0</span> Compare
    </button>
  </section>

  <script type="module" src="js/app.js?v=20260917g"></script>
</body>
</html>
